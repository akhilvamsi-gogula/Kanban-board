[project]
name = "kanban-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "httpx==0.28.1",
    "python-dotenv==1.1.1",
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
